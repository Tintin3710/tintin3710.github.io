<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Airbridge 기여기간 설정 과제</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{color-scheme:light;--bg:#FAFAFB;--surface:#FFFFFF;--border:#E2E5EA;--border-strong:#CBD1DA;--text:#202124;--body:#414854;--secondary:#5F6B7C;--muted:#8993A3;--accent:#2B63D9;--accent-hover:#214FB3;--accent-soft:#EAF0FF;--focus:#356DFF}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--body);font-family:Inter,"Noto Sans KR",-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased;word-break:keep-all}
main{max-width:720px;margin:0 auto;padding:96px 24px 80px}
.eyebrow{display:inline-block;font-size:12px;font-weight:500;line-height:1.5;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:3px 9px;margin:0 0 20px}
h1{font-weight:600;font-size:44px;line-height:1.2;letter-spacing:-0.02em;color:var(--text);margin:0 0 20px;text-wrap:balance}
.lede{font-size:17px;line-height:1.7;color:var(--secondary);margin:0 0 40px;max-width:60ch}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
a.card{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;color:inherit;text-decoration:none;transition:border-color .15s}
a.card:hover{border-color:var(--border-strong)}
a.card:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.card b{font-size:18px;font-weight:600;color:var(--text);letter-spacing:-0.01em}
.card span{font-size:14px;line-height:1.6;color:var(--secondary)}
.card .go{margin-top:auto;padding-top:12px;font-size:14px;font-weight:500;color:var(--accent)}
a.card:hover .go{color:var(--accent-hover)}
@media (max-width:640px){main{padding:56px 16px 48px}h1{font-size:32px}.lede{font-size:16px}.cards{grid-template-columns:1fr}}
</style></head>
<body><main>
<p class="eyebrow">AB180 Product Designer 과제</p>
<h1>Airbridge 기여기간 설정</h1>
<p class="lede">직접 조작해 볼 수 있는 웹 프로토타입과, 화면을 그렇게 만든 이유를 정리한 설계 의도 문서입니다.</p>
<div class="cards">
<a class="card" href="https://tintin3710.github.io/ab180-airbridge-prototype/"><b>프로토타입</b><span>앱·채널·캠페인 기여기간을 확인하고 바꿔 보는 화면</span><span class="go">열기 →</span></a>
<a class="card" href="https://tintin3710.github.io/ab180-airbridge-prototype/design-rationale/"><b>설계 의도 문서</b><span>문제 정의부터 판단 과정, 검증과 남은 한계까지</span><span class="go">읽기 →</span></a>
</div>
</main></body></html>
